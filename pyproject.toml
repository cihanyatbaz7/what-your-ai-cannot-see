[project]
name = "what-your-ai-cannot-see"
version = "0.1.0"
description = "Predict whether a Dutch train disruption lasts longer than 60 minutes."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "disruptions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
